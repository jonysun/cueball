services:
  cueball:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-cueball-aiming-simulator:latest}
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
